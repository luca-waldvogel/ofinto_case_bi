[project]
name = "ofinto-case-bi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.4,<2", "typer>=0.16,<1"]

[project.scripts]
ofinto = "ofinto_case_bi.main:app"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofinto_case_bi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
